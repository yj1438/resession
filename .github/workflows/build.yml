# 双平台构建：测试 → tauri build（免打包）→ 产物上传
# 触发：push main（日常验证）/ 手动 / v* 标签（发版：自动创建 Release 并附产物）
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # 发版需要创建 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ReSession-windows-x64
            bin: src-tauri/target/release/resession.exe
          - os: macos-latest
            artifact: ReSession-macos-arm64
            bin: src-tauri/target/release/resession
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 平台无关的核心库测试（macOS 上跑通即验证编译链路）
      - name: Run session-core tests
        working-directory: crates/session-core
        run: cargo test

      - name: Install frontend deps
        run: npm ci

      - name: Build (no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

      # 仅 tag 触发时：按版本号重命名产物并挂到 GitHub Release
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          [ -f src-tauri/target/release/resession.exe ] && \
            cp src-tauri/target/release/resession.exe "dist/ReSession-${{ github.ref_name }}-windows-x64.exe" || true
          [ -f src-tauri/target/release/resession ] && \
            cp src-tauri/target/release/resession "dist/ReSession-${{ github.ref_name }}-macos-arm64" || true
          ls -la dist/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
