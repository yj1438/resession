[package]
name = "resession"
version = "0.8.1"
edition = "2024"
description = "ReSession - lightweight native agent session manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
trash = "5"
session-core = { path = "../crates/session-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
