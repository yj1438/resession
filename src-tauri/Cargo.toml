[package]
name = "resession"
version = "0.1.0"
edition = "2024"
description = "ReSession - lightweight native agent session manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
trash = "5"
session-core = { path = "../crates/session-core" }
